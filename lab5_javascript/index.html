        <section>
            <h3>Daftar Menu Makanan</h3> <label><input type="checkbox" class="menu" value="5000"> Ayam Goreng —
                Rp5.000</label><br>
            <label>

            <p>Total: Rp<span id="total">0</span></p>

        <section>
            <form>
                <label for="bilangan">Masukkan bilangan bulat:</label> <input type="number" id="bilangan" step="1">
                <button type="button" onclick="cekGenap()">Periksa</button>
                <p id="hasilBilangan"></p>
            </form>
        </section>

        <section>
            <form>
                <label for="bilangan">Masukkan nilai Tugas : </label><br>
                <input type="number" id="nilaiTugas" step="1"><br>
                <label for="bilangan">Masukkan nilai UTS: </label><br>
                <input type="number" id="nilaiUTS" step="1"><br>
                <label for="bilangan">Masukkan nilai UAS: </label><br>
                <input type="number" id="nilaiUAS" step="1"><br>

                <button type="button" onclick="cekNilaiAll()">Periksa</button>
                <p id="hasilBilangan"></p>
                <div id="output-nilai">

                </div>
            </form>
        </section>
        <section id="section-toggle" style="margin-top: 30px; padding: 20px; border: 1px solid #ccc;">
            <h3>Fitur Sembunyikan/Tampilkan</h3>
            <p>Klik tombol di bawah ini untuk melihat efeknya.</p>

            <!-- Tombol pemicu -->
            <button type="button" id="tombolToggle" onclick="toggleElemen()">Sembunyikan Elemen</button>

            <!-- Elemen yang akan disembunyikan/ditampilkan -->
            <div id="elemenTarget"
                style="margin-top: 15px; padding: 15px; background-color: lightblue; border-radius: 5px;">
